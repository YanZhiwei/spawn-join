name: Publish Python package

# GitHub Packages has no Python registry, so distributions are published as
# GitHub Release assets and exposed through a static PEP 503 index on GitHub
# Pages (branch `gh-pages`).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - all
          - spawn-join-core
          - spawn-join-common
          - spawn-join-llm-provider
          - spawn-join-llm-provider-langchain
          - spawn-join-llm-channel
          - spawn-join-llm-model-sync
          - spawn-join-agent-deepagents
          - spawn-join-agent-work
          - spawn-join-personal-assistant
      release_tag:
        description: GitHub Release tag that stores the distributions
        required: true
        default: python-0.0.1.dev0

permissions:
  contents: write

concurrency:
  group: publish-python-${{ inputs.package }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'

      - name: Verify and build in dependency order
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
        run: |
          $packages = [ordered]@{
            'spawn-join-core' = 'packages/core/spawn-join-core'
            'spawn-join-common' = 'packages/core/common'
            'spawn-join-llm-provider' = 'packages/core/llm-provider'
            'spawn-join-llm-provider-langchain' = 'packages/infra/llm-provider-langchain'
            'spawn-join-llm-channel' = 'packages/infra/llm-channel'
            'spawn-join-llm-model-sync' = 'packages/infra/llm-model-sync'
            'spawn-join-agent-deepagents' = 'packages/infra/agent-deepagents'
            'spawn-join-agent-work' = 'packages/infra/agent-work'
            'spawn-join-personal-assistant' = 'packages/apps/personal-assistant'
          }
          if ($env:SELECTED_PACKAGE -eq 'all') {
            $targets = @($packages.Keys)
          } elseif ($packages.Contains($env:SELECTED_PACKAGE)) {
            $targets = @($env:SELECTED_PACKAGE)
          } else {
            throw "Unknown package: $env:SELECTED_PACKAGE"
          }

          $distRoot = Join-Path $env:RUNNER_TEMP 'spawn-join-dist'
          New-Item -ItemType Directory -Path $distRoot -Force | Out-Null
          foreach ($package in $targets) {
            $directory = $packages[$package]
            Write-Host "Checking $package in $directory"
            uv lock --check --directory $directory
            uv sync --locked --directory $directory
            ./scripts/quality.ps1 -Package $package
            $output = Join-Path $distRoot $package
            New-Item -ItemType Directory -Path $output -Force | Out-Null
            uv build --no-sources --out-dir $output --directory $directory
          }
          Write-Host "Artifacts:"
          Get-ChildItem $distRoot -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $distRoot = Join-Path $env:RUNNER_TEMP 'spawn-join-dist'
          $files = @(Get-ChildItem $distRoot -Recurse -File |
            Where-Object { $_.Extension -in '.whl', '.gz' } |
            ForEach-Object { $_.FullName })
          if (-not $files) { throw 'No distribution artifacts were built.' }

          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "Python distributions $tag" `
              --notes "Wheel and sdist assets for the SpawnJoin Python distributions."
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @files
          if ($LASTEXITCODE -ne 0) { throw "Could not upload assets to $tag" }

      - name: Generate PEP 503 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = Join-Path $env:RUNNER_TEMP 'releases.json'
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate |
            Set-Content -Path $releases -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not read releases.' }
          python scripts/build_pypi_index.py `
            --releases-json $releases `
            --out (Join-Path $env:RUNNER_TEMP 'site')

      - name: Publish index to GitHub Pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $site = Join-Path $env:RUNNER_TEMP 'site'
          $pages = Join-Path $env:RUNNER_TEMP 'pages'
          New-Item -ItemType Directory -Path $pages -Force | Out-Null
          Copy-Item -Path (Join-Path $site '*') -Destination $pages -Recurse -Force
          git -C $pages init --quiet
          git -C $pages checkout --quiet -b gh-pages
          git -C $pages config user.name 'github-actions[bot]'
          git -C $pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $pages add --all
          git -C $pages commit --quiet -m 'docs: publish Python package index'
          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git -C $pages push --quiet --force $remote gh-pages
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the Pages branch.' }
          Write-Host "Index published for $env:GITHUB_REPOSITORY"
