  - "No blocking finding remains. F-04 and F-06 are open but non-blocking minor findings; G-01 is resolved."
  - "ADR-0010 is Accepted and indexed as Accepted; it is self-contained and consistent with current implementation."
  - "No product source, test, package, ADR or index content changed after 13692d7e; the prior 114-test and format/lint/type evidence remains current. Docs/governance/static checks pass at ff91d98. Remote CI was not run."
  - "Tests and probes use deterministic fake models, structural catalog doubles and in-memory checkpointing. No real provider, network, MCP server, sandbox, durable Store or production observability backend was exercised."
  - "Fork mode still has no runtime execution test; only the opt-in gate and upstream version/contract checks are covered."
  - "With control_default_subagent=False, the upstream_default report lists the known default-slot middleware names; profile extras, skills and prompt-caching middleware are not enumerated. The report warning marks the subagent as upstream-owned, and the README notes that the actual graph remains authoritative if a harness profile disables the default."
  - "ResourceReport.thread_id_required remains tied to interrupt configuration rather than checkpointer presence; its semantics for a checkpointer without interrupts are still only partially documented."
  - "Installer-managed Delivery v0.3.2 commands, generated catalogs/records and generated registry files were sampled rather than fully reviewed; they are not product runtime."
  - "test_public_api is hand-maintained and mirrors the current __all__; it does not automatically derive the approved contract."
