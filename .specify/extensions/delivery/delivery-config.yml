# Spec Kit Delivery configuration for SpawnJoin.
# Read by the installed speckit.delivery.* commands.
version: 1
schema_version: "1.0"
project: spawn-join
integration: opencode

# Upstream command fields; nested settings below retain the project safety contract.
artifact_policy: ephemeral
issue_tracker: github
context_files:
  - .specify/memory/constitution.md
  - AGENTS.md
  - docs/architecture/package-boundaries.md
  - docs/development/quality-gates.md
adr_directories: [docs/decisions]
max_convergence_rounds: 2
max_review_fix_rounds: 2
docs_sync: auto
# Delivery slicing: this repository requires linear history and one reviewed PR
# per change. The final merge-commit rollup is incompatible with that ruleset,
# so sliced integration delivery stays disabled until this policy is revisited.
pr_slicing: "off"
slice_warn_files: 20
slice_warn_lines: 400
slice_requires_approval: true
stack_provider: manual
merge_policy:
  slice: squash
  final: squash
  sync: merge
  use_queue: false
  delete_branch: true
  freeze_before_final: true
code_context: auto
# Use the project-owned Chinese copy of the SD repository PR template for both
# Handoff and the GitHub UI. The extension's packaged fallback stays English;
# this file is intentionally not the installer-owned fallback.
pull_request_template: .github/pull_request_template.md
install_pull_request_template: false

artifacts:
  policy: ephemeral
  local_root: specs/
  resume: local-only
  durable_requirements: false

context:
  constitution: .specify/memory/constitution.md
  agents: AGENTS.md
  architecture: docs/architecture/
  decisions: docs/decisions/

adr:
  root: docs/decisions/
  proposed_status: Proposed
  accepted_requires_reviewed_head: true

verification:
  all: pwsh -NoProfile -File scripts/quality.ps1
  governance: pwsh -NoProfile -File scripts/quality.ps1 -Check governance
  static: pwsh -NoProfile -File scripts/quality.ps1 -Check static
  docs: pwsh -NoProfile -File scripts/quality.ps1 -Check docs
  gate_regression: pwsh -NoProfile -File scripts/test-quality.ps1
  governance_regression: pwsh -NoProfile -File scripts/test-governance.ps1
  static_regression: pwsh -NoProfile -File scripts/test-static.ps1

docs_sync_policy:
  required: true
  owners:
    quality_gates: docs/development/quality-gates.md
    architecture: docs/architecture/
    decisions: docs/decisions/

ralph:
  branch_prefix: ralph/
  parallel_workers: false
  evidence_root: .specify/delivery/
  receipt_pattern: .specify/delivery/<feature-id>/receipts/<task-id>.md
  max_converge_loops: 2
  max_review_rounds: 2
  require_clean_worktree: true
  auto_commit: task-only
  auto_push: false
  auto_merge: false
  task_gate: "RALPH_TASK_GATE: PASS"
  verdicts:
    quality: "QUALITY_VERDICT: pass"
    standards: "STANDARDS_VERDICT: pass"
