[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-join-personal-assistant"
version = "0.1.0"
description = "Personal assistant host application: durable work items, scheduling, approvals, and CLI for SpawnJoin."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Yan Zhiwei" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "spawn-join-agent-deepagents>=0.1.0,<0.2.0",
    "spawn-join-agent-work>=0.1.0,<0.2.0",
    "spawn-join-llm-provider-langchain>=0.1.0,<0.2.0",
]

[project.urls]
Repository = "https://github.com/YanZhiwei/spawn-join"

[project.scripts]
spawn-join-personal-assistant = "spawn_join_personal_assistant.cli:main"

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "isort>=9.0.2,<10",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<0.18",
]

[tool.uv.sources]
spawn-join-agent-deepagents = { path = "../../infra/agent-deepagents", editable = true }
spawn-join-agent-work = { path = "../../infra/agent-work", editable = true }
spawn-join-llm-provider-langchain = { path = "../../infra/llm-provider-langchain", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spawn_join_personal_assistant = ["py.typed"]
