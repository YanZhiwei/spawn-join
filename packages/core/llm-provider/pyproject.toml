[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-join-llm-provider"
version = "0.1.0"
description = "Provider-agnostic LLM protocols and abstractions for SpawnJoin."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Yan Zhiwei" }]
requires-python = ">=3.11"
dependencies = ["spawn-join-core>=0.1.0,<0.2.0"]

[project.urls]
Repository = "https://github.com/YanZhiwei/spawn-join"

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "isort>=9.0.2,<10",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<0.18",
]

[tool.uv.sources]
spawn-join-core = { path = "../spawn-join-core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spawn_join_llm_provider = ["py.typed"]
