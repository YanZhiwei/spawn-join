[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-join-llm-provider"
version = "0.1.0"
description = "Provider-agnostic LLM protocols and abstractions for SpawnJoin."
requires-python = ">=3.11"
dependencies = ["spawn-join-core>=0.1.0,<0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
