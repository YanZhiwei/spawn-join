[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-join-core"
version = "0.1.0"
description = "Shared contracts and primitives for the SpawnJoin package ecosystem."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "isort>=9.0.2,<10",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<0.18",
]

[tool.setuptools.packages.find]
where = ["src"]
