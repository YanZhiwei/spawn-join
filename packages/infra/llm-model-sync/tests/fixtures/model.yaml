schema_version: 2
default: fast
models:
  fast:
    protocol: chat_completions
    endpoint: https://api.example.com/v1
    model: gpt-5
    api_key_env: FAST_API_KEY
    metadata_ref: openai/gpt-5
    metadata_source:
      models.dev:
        provider: openai
        model: gpt-5
  fast-backup:
    protocol: chat_completions
    endpoint: https://backup.example.com/v1
    model: gpt-5
    api_key_env: BACKUP_API_KEY
    metadata_ref: openai/gpt-5
    metadata_source:
      models.dev:
        provider: backup
        model: gpt-5
  other:
    protocol: chat_completions
    endpoint: https://api.example.com/v1
    model: other
    api_key_env: FAST_API_KEY
    metadata_ref: openai/other
    metadata_source:
      models.dev:
        provider: openai
        model: other
