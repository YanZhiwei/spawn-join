[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-join-llm-provider-langchain"
version = "0.1.0"
description = "LangChain adapter for SpawnJoin's provider-agnostic LLM protocols."
requires-python = ">=3.11"
dependencies = [
    "spawn-join-llm-provider>=0.1.0,<0.2.0",
    "langchain-core>=1.0,<2.0",
]

[tool.uv.sources]
spawn-join-llm-provider = { path = "../../core/llm-provider", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
