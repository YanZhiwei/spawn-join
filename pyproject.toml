# Shared tool policy only: this is NOT a Python project or uv workspace.
# Dependencies, virtual environments and lockfiles belong to each Distribution.
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 311
known_first_party = [
    "spawn_join_core",
    "spawn_join_llm_provider",
    "spawn_join_llm_provider_langchain",
    "spawn_join_observability",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Black owns formatting; isort owns imports. Do not enable I or ruff format.
select = ["E4", "E7", "E9", "F", "B", "UP", "T20", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "All"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
